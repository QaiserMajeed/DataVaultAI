<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="logoGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A78BFA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F472B6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: Vault/Database with AI Neural Network -->
  <g transform="translate(5, 5)">
    <!-- Outer vault frame -->
    <rect x="0" y="0" width="40" height="40" rx="8" fill="url(#logoGradientDark)" opacity="0.1"/>
    <rect x="0" y="0" width="40" height="40" rx="8" stroke="url(#logoGradientDark)" stroke-width="2.5" fill="none"/>

    <!-- Data layers (vault concept) -->
    <line x1="8" y1="13" x2="32" y2="13" stroke="url(#logoGradientDark)" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="20" x2="32" y2="20" stroke="url(#logoGradientDark)" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="27" x2="32" y2="27" stroke="url(#logoGradientDark)" stroke-width="2" stroke-linecap="round"/>

    <!-- AI neural nodes -->
    <circle cx="12" cy="13" r="2.5" fill="#60A5FA"/>
    <circle cx="20" cy="13" r="2.5" fill="#A78BFA"/>
    <circle cx="28" cy="13" r="2.5" fill="#F472B6"/>

    <circle cx="16" cy="20" r="2.5" fill="#8B5CF6"/>
    <circle cx="24" cy="20" r="2.5" fill="#EC4899"/>

    <circle cx="20" cy="27" r="2.5" fill="#A78BFA"/>

    <!-- Neural connections (subtle) -->
    <line x1="12" y1="13" x2="16" y2="20" stroke="#60A5FA" stroke-width="1" opacity="0.4"/>
    <line x1="20" y1="13" x2="16" y2="20" stroke="#A78BFA" stroke-width="1" opacity="0.4"/>
    <line x1="20" y1="13" x2="24" y2="20" stroke="#A78BFA" stroke-width="1" opacity="0.4"/>
    <line x1="28" y1="13" x2="24" y2="20" stroke="#F472B6" stroke-width="1" opacity="0.4"/>
    <line x1="16" y1="20" x2="20" y2="27" stroke="#8B5CF6" stroke-width="1" opacity="0.4"/>
    <line x1="24" y1="20" x2="20" y2="27" stroke="#EC4899" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Text: Data Valut AI -->
  <text x="55" y="22" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">
    Data Valut
  </text>
  <text x="55" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="url(#logoGradientDark)">
    AI
  </text>
</svg>
