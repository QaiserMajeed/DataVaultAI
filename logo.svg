<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9333EA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="logoGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DB2777;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: Vault/Database with AI Neural Network -->
  <g transform="translate(5, 5)">
    <!-- Outer vault frame -->
    <rect x="0" y="0" width="40" height="40" rx="8" fill="url(#logoGradient)" opacity="0.1"/>
    <rect x="0" y="0" width="40" height="40" rx="8" stroke="url(#logoGradient)" stroke-width="2.5" fill="none"/>

    <!-- Data layers (vault concept) -->
    <line x1="8" y1="13" x2="32" y2="13" stroke="url(#logoGradient)" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="20" x2="32" y2="20" stroke="url(#logoGradient)" stroke-width="2" stroke-linecap="round"/>
    <line x1="8" y1="27" x2="32" y2="27" stroke="url(#logoGradient)" stroke-width="2" stroke-linecap="round"/>

    <!-- AI neural nodes -->
    <circle cx="12" cy="13" r="2.5" fill="#3B82F6"/>
    <circle cx="20" cy="13" r="2.5" fill="#9333EA"/>
    <circle cx="28" cy="13" r="2.5" fill="#EC4899"/>

    <circle cx="16" cy="20" r="2.5" fill="#7C3AED"/>
    <circle cx="24" cy="20" r="2.5" fill="#DB2777"/>

    <circle cx="20" cy="27" r="2.5" fill="#9333EA"/>

    <!-- Neural connections (subtle) -->
    <line x1="12" y1="13" x2="16" y2="20" stroke="#3B82F6" stroke-width="1" opacity="0.3"/>
    <line x1="20" y1="13" x2="16" y2="20" stroke="#9333EA" stroke-width="1" opacity="0.3"/>
    <line x1="20" y1="13" x2="24" y2="20" stroke="#9333EA" stroke-width="1" opacity="0.3"/>
    <line x1="28" y1="13" x2="24" y2="20" stroke="#EC4899" stroke-width="1" opacity="0.3"/>
    <line x1="16" y1="20" x2="20" y2="27" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>
    <line x1="24" y1="20" x2="20" y2="27" stroke="#DB2777" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Text: Data Valut AI -->
  <text x="55" y="22" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#1E293B" class="logo-text">
    Data Valut
  </text>
  <text x="55" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="url(#logoGradient)">
    AI
  </text>

  <style>
    @media (prefers-color-scheme: dark) {
      .logo-text {
        fill: #F8FAFC;
      }
    }
  </style>
</svg>
