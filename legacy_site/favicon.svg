<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#9333EA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Icon: Vault/Database with AI Neural Network -->
  <g transform="translate(5, 5)">
    <!-- Outer vault frame -->
    <rect x="0" y="0" width="40" height="40" rx="8" fill="url(#faviconGradient)" opacity="0.15"/>
    <rect x="0" y="0" width="40" height="40" rx="8" stroke="url(#faviconGradient)" stroke-width="2.5" fill="none"/>

    <!-- Data layers (vault concept) -->
    <line x1="8" y1="13" x2="32" y2="13" stroke="url(#faviconGradient)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="20" x2="32" y2="20" stroke="url(#faviconGradient)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="8" y1="27" x2="32" y2="27" stroke="url(#faviconGradient)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- AI neural nodes -->
    <circle cx="12" cy="13" r="3" fill="#3B82F6"/>
    <circle cx="20" cy="13" r="3" fill="#9333EA"/>
    <circle cx="28" cy="13" r="3" fill="#EC4899"/>

    <circle cx="16" cy="20" r="3" fill="#7C3AED"/>
    <circle cx="24" cy="20" r="3" fill="#DB2777"/>

    <circle cx="20" cy="27" r="3" fill="#9333EA"/>

    <!-- Neural connections (subtle) -->
    <line x1="12" y1="13" x2="16" y2="20" stroke="#3B82F6" stroke-width="1.5" opacity="0.4"/>
    <line x1="20" y1="13" x2="16" y2="20" stroke="#9333EA" stroke-width="1.5" opacity="0.4"/>
    <line x1="20" y1="13" x2="24" y2="20" stroke="#9333EA" stroke-width="1.5" opacity="0.4"/>
    <line x1="28" y1="13" x2="24" y2="20" stroke="#EC4899" stroke-width="1.5" opacity="0.4"/>
    <line x1="16" y1="20" x2="20" y2="27" stroke="#7C3AED" stroke-width="1.5" opacity="0.4"/>
    <line x1="24" y1="20" x2="20" y2="27" stroke="#DB2777" stroke-width="1.5" opacity="0.4"/>
  </g>
</svg>
