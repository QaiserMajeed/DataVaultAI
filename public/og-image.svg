<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="og-title og-desc">
  <title id="og-title">DataVault.AI - Enterprise AI, Web, Mobile &amp; Cloud Development</title>
  <desc id="og-desc">DataVault.AI delivers enterprise-grade AI, web, mobile, and cloud development services. 99.9% uptime, sub-15-minute response time.</desc>

  <!-- Background -->
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- Subtle architectural grid -->
  <g stroke="#000000" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
  </g>

  <!-- Logo block -->
  <g transform="translate(80,72)">
    <rect x="0" y="0" width="56" height="56" fill="none" stroke="#000000" stroke-width="3"/>
    <text x="28" y="38" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="700" font-size="22" fill="#000000">DV</text>
    <text x="76" y="36" font-family="'Playfair Display', Georgia, serif" font-weight="700" font-size="28" fill="#000000">DataVault.AI</text>
  </g>

  <!-- Eyebrow label -->
  <g transform="translate(80,168)">
    <rect x="0" y="0" width="380" height="40" fill="none" stroke="#000000" stroke-width="2"/>
    <text x="20" y="26" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" font-size="14" letter-spacing="3" fill="#000000">ENTERPRISE-GRADE INFRASTRUCTURE</text>
  </g>

  <!-- Headline (4 lines, mirrors the live Hero) -->
  <g font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="74" fill="#000000" letter-spacing="-2">
    <text x="80" y="270">Engineering</text>
    <text x="80" y="346">Excellence.</text>
    <text x="80" y="422" font-style="italic">Measurable</text>
    <text x="80" y="498">Results.</text>
  </g>

  <!-- Decorative rule -->
  <g transform="translate(80,528)">
    <rect x="0" y="0" width="14" height="14" fill="none" stroke="#000000" stroke-width="2"/>
    <rect x="22" y="5" width="180" height="4" fill="#000000"/>
  </g>

  <!-- Service strip -->
  <g transform="translate(80,576)" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="600" font-size="14" letter-spacing="2" fill="#000000">
    <text x="0" y="14">AI</text>
    <text x="60" y="14">·</text>
    <text x="80" y="14">WEB</text>
    <text x="160" y="14">·</text>
    <text x="180" y="14">MOBILE</text>
    <text x="300" y="14">·</text>
    <text x="320" y="14">CLOUD</text>
  </g>

  <!-- Stats rail (right) -->
  <g transform="translate(820,168)" font-family="'JetBrains Mono', ui-monospace, monospace" fill="#000000">
    <rect x="0" y="0" width="300" height="100" fill="none" stroke="#000000" stroke-width="2"/>
    <text x="150" y="56" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="44">99.9%</text>
    <text x="150" y="84" text-anchor="middle" font-size="12" letter-spacing="3">UPTIME SLA</text>

    <rect x="0" y="116" width="300" height="100" fill="none" stroke="#000000" stroke-width="2"/>
    <text x="150" y="172" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="44">&lt;15 MIN</text>
    <text x="150" y="200" text-anchor="middle" font-size="12" letter-spacing="3">RESPONSE TIME</text>

    <rect x="0" y="232" width="300" height="100" fill="none" stroke="#000000" stroke-width="2"/>
    <text x="150" y="288" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="800" font-size="44">60%</text>
    <text x="150" y="316" text-anchor="middle" font-size="12" letter-spacing="3">COST REDUCTION</text>
  </g>

  <!-- Bottom rule -->
  <rect x="0" y="624" width="1200" height="6" fill="#000000"/>
</svg>
